name: CTUBE Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        # Version read from "packageManager" in package.json (single source of truth)
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the web app (creates .next/standalone/)
      - run: pnpm build
      - name: Prepare Capacitor shell
        run: node scripts/prepare-mobile-shell.mjs
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      - run: npx cap add android || true
      - run: npx cap sync android
      # Allow playback to continue with the screen locked / app in background
      - name: Patch Android background playback permissions
        run: node scripts/patch-android-background.mjs
      # Optional release signing: with ANDROID_KEYSTORE_B64 / PASSWORD / ALIAS
      # configured, the APK is signed with the SAME keystore on every build, so
      # updates install over previous versions without signature errors and Play
      # Protect warnings are reduced (release-signed instead of debug-signed).
      # Without the secrets the build keeps using the Android debug keystore.
      - name: Patch Android release signing config
        run: node scripts/patch-android-signing.mjs
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Copy APK to installers folder
        run: |
          mkdir -p installers/android
          APK_PATH=$(find android -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -1)
          fi
          cp "$APK_PATH" installers/android/CTUBE.apk
          echo "APK saved: $(ls -lh installers/android/CTUBE.apk)"
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-Android
          path: installers/android/CTUBE.apk
          if-no-files-found: error
      # On tag pushes (v1.x.x), publish the APK to a GitHub Release so the
      # in-app "nova versão" update alert can point at it. The three workflows
      # run in parallel on the same tag and race to create the release, so the
      # publish step is idempotent: "create || true" (ignore if another
      # workflow already created it) + "upload --clobber" (attach/replace our
      # asset on that shared release).
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "CTUBE $TAG" --generate-notes || true
          if ! gh release upload "$TAG" installers/android/CTUBE.apk --clobber; then
            echo "::warning::gh release upload failed for $TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
