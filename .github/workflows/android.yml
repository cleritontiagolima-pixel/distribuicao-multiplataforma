name: CTUBE Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the web app (creates .next/standalone/)
      - run: pnpm build
      - name: Prepare Capacitor shell
        run: node scripts/prepare-mobile-shell.mjs
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      - run: npx cap add android || true
      - run: npx cap sync android
      # Allow playback to continue with the screen locked / app in background
      - name: Patch Android background playback permissions
        run: node scripts/patch-android-background.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew assembleDebug
      - name: Copy APK to installers folder
        run: |
          mkdir -p installers/android
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -1)
          cp "$APK_PATH" installers/android/CTUBE.apk
          echo "APK saved: $(ls -lh installers/android/CTUBE.apk)"
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-Android
          path: installers/android/CTUBE.apk
          if-no-files-found: error
      # On tag pushes (v1.x.x), publish the APK to a GitHub Release so the
      # in-app "nova versão" update alert can point at it.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" installers/android/CTUBE.apk --title "CTUBE $TAG" --generate-notes --clobber
          gh release upload "$TAG" installers/android/CTUBE.apk --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}
