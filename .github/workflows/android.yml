name: CTUBE Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare Capacitor shell
        run: node scripts/prepare-mobile-shell.mjs
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      - run: npx cap add android || true
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew assembleDebug
      # Copy APK to installers/android/ for easy download
      - name: Copy APK to installers folder
        run: |
          mkdir -p installers/android
          cp android/app/build/outputs/apk/debug/app-debug.apk installers/android/CTUBE.apk
          echo "APK saved to installers/android/CTUBE.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-Android
          path: installers/android/CTUBE.apk
          if-no-files-found: error
