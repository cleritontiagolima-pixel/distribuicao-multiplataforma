name: CTUBE Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Prepare Capacitor shell — CTUBE_URL tells the app where to load from
      - run: node scripts/prepare-mobile-shell.mjs
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      - run: npx cap add android || true
      - run: npx cap sync android
      # Setup Java 21 for Capacitor Android (requires JDK 21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: ctube-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
