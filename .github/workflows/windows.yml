name: CTUBE Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CTUBE_URL: ${{ secrets.CTUBE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build creates .next/server/app/ with pre-rendered HTML pages
      - run: pnpm build
      # Verify build output exists
      - name: Verify build output
        run: |
          if (Test-Path ".next/server/app/index.html") {
            Write-Host "Build output OK"
          } elseif (Test-Path ".next/server/app") {
            $files = Get-ChildItem .next/server/app -Recurse -Filter "*.html"
            Write-Host "Found $($files.Count) HTML files in .next/server/app/"
          } else {
            Write-Warning ".next/server/app not found - pages may not be pre-rendered"
          }
          if (Test-Path ".next/static") {
            $size = (Get-ChildItem .next/static -Recurse | Measure-Object -Property Length -Sum).Sum
            Write-Host "Static assets size: $([math]::Round($size/1MB, 1)) MB"
          }
        shell: pwsh
      # Create self-signed certificate for code signing
      - name: Create code signing certificate
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=CTUBE, O=CTUBE, C=BR" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(5) `
            -KeyAlgorithm RSA `
            -KeyLength 2048
          $pwd = ConvertTo-SecureString -String "ctube123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "ctube-cert.pfx" -Password $pwd
          echo "Certificate created: $($cert.Thumbprint)"
        shell: pwsh
      # Build Electron with embedded HTTP server + preload script
      - run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ctube-cert.pfx
          CSC_KEY_PASSWORD: ctube123
      # Copy correct installer (not uninstaller)
      - name: Copy installer to installers folder
        run: |
          New-Item -ItemType Directory -Force -Path installers/windows | Out-Null
          $installer = Get-ChildItem dist -Filter "CTUBE Setup*.exe" | Where-Object { $_.Name -notmatch "uninstaller" } | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "installers/windows/CTUBE-Setup.exe"
            Write-Host "Copied: $($installer.Name) ($($installer.Length) bytes)"
          } else {
            Write-Error "No NSIS installer found in dist/"
            exit 1
          }
        shell: pwsh
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-Windows
          path: installers/windows/CTUBE-Setup.exe
          if-no-files-found: error
      # On tag pushes (v1.x.x), publish the installer to a GitHub Release so
      # the in-app "nova versão" update alert can point at it.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "Publishing $tag"
          gh release create $tag installers/windows/CTUBE-Setup.exe --title "CTUBE $tag" --generate-notes --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release exists, uploading asset..."
            gh release upload $tag installers/windows/CTUBE-Setup.exe --clobber
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gh release upload failed"; exit 0 }
        env:
          GH_TOKEN: ${{ github.token }}
