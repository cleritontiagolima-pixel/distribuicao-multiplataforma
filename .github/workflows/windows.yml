name: CTUBE Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    env:
      CTUBE_URL: ${{ secrets.CTUBE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx electron-builder --publish never
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      # Copy EXE to installers/windows/ for easy download
      - name: Copy EXE to installers folder
        run: |
          mkdir -p installers\windows
          copy dist\*.exe installers\windows\CTUBE-Setup.exe
          echo "EXE saved to installers\windows\CTUBE-Setup.exe"
        shell: cmd
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-Windows
          path: installers/windows/CTUBE-Setup.exe
          if-no-files-found: error
