name: CTUBE iOS
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the web app (creates .next/standalone/)
      - run: pnpm build
      - name: Prepare Capacitor shell
        run: node scripts/prepare-mobile-shell.mjs
        env:
          CTUBE_URL: ${{ secrets.CTUBE_URL }}
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Install CocoaPods
        run: |
          if [ -d "ios/App/Podfile" ]; then
            cd ios/App && pod install
          elif [ -d "ios/Podfile" ]; then
            cd ios && pod install
          fi
      - name: Build iOS Simulator
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 3 | head -1)
          echo "Building workspace: $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Copy app to installers folder
        run: |
          mkdir -p installers/ios
          APP_PATH=$(find build -name "App.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" installers/ios/CTUBE.app
            echo "App saved to installers/ios/CTUBE.app"
          else
            echo "App bundle not found, zipping build output instead"
            cd build && zip -r ../installers/ios/CTUBE-simulator.zip . && cd ..
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: CTUBE-iOS
          path: installers/ios/
          if-no-files-found: error
